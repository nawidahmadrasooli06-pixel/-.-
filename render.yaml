services:
  - type: web
    name: cactuc-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_USERNAME
        value: cactuc580

      - key: ADMIN_CHAT_ID
        sync: false

      - key: PYTHON_VERSION
        value: 3.12.10
